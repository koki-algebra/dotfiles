"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$python\
$rust\
$character"""

right_format = """$cmd_duration"""

add_newline = false

[directory]
style = "cyan bold"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"

[git_branch]
format = "[$symbol$branch]($style) "
style = "purple bold"

[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "yellow bold"

[golang]
format = "[$symbol$version]($style) "
symbol = "🐹 "

[nodejs]
format = "[$symbol$version]($style) "
symbol = "⬢ "

[python]
format = "[$symbol$version]($style) "
symbol = "🐍 "

[rust]
format = "[$symbol$version]($style) "
symbol = "🦀 "

[cmd_duration]
format = "[$duration]($style)"
style = "yellow dimmed"
min_time = 2000
